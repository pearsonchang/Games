<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101113"><title>小火箭 · PLAYROOM</title><link rel="stylesheet" href="rocket.css"></head><body><main class="rocket-game"><header><button id="back">← 大厅</button><div>小火箭<span>PLAYROOM</span></div><button id="rules" aria-label="玩法说明">?</button></header><section class="wallet"><span>模拟积分余额 <b id="balance">—</b></span><span class="demo">DEMO</span></section><section class="space" id="space" aria-label="火箭飞行画面"><div class="space-grid" aria-hidden="true"></div><div id="stars" aria-hidden="true"></div><div class="flight-status"><span id="status">准备发射</span><strong id="multiplier">1.00<span>×</span></strong><p id="flight-time">飞得越久，收取得分越高</p></div><svg class="flight-path" viewBox="0 0 420 400" aria-hidden="true"><defs><linearGradient id="trail" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffb327" stop-opacity="0"/><stop offset="1" stop-color="#ffb327"/></linearGradient></defs><path id="route" d="M 46 340 Q 180 340 300 180" fill="none" stroke="url(#trail)" stroke-width="3" stroke-dasharray="4 6"/></svg><div id="rocket" class="rocket"><img src="rocket.png" alt="橙色卡通小火箭" draggable="false"></div><div id="burst" aria-hidden="true">✦</div><span class="launch-pad">LAUNCH ZONE</span></section><section class="controls"><div class="round-summary"><span>本局消耗 <b>50 积分</b></span><span id="payout-label">当前可收取 <b id="payout">—</b></span></div><button id="action" disabled>正在连接大厅…</button><p id="message" role="status" aria-live="polite">每次发射消耗 50 积分；坠毁前主动收取。</p><p class="disclaimer">仅模拟积分 · 无真实资金 · 切出页面不会暂停飞行</p></section><dialog id="dialog"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div id="dialog-actions"></div></dialog></main><script src="rocket.js"></script></body></html>
