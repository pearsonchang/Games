<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>ORBIT · 小火箭</title><link rel="stylesheet" href="rocket.css"><link rel="stylesheet" href="arcade-theme.css?v=blue30"></head><body><main class="rocket-game"><header><div class="header-left"><button id="back" aria-label="返回游戏大厅">←</button><div class="brand">ORBIT<span>小火箭 / PLAYROOM</span></div></div><section class="wallet"><span>模拟积分余额</span><b id="balance">—</b></section><button id="rocket-sound" aria-pressed="true" aria-label="关闭音效" title="音效开关">♪</button><button id="rules" aria-label="玩法说明">?</button></header><div class="arena-grid"><section class="space" id="space" aria-label="火箭飞行画面"><div class="space-grid" aria-hidden="true"></div><div id="stars" aria-hidden="true"></div><div id="speed-lines" aria-hidden="true"></div><div class="stage-top"><span>ORBIT FLIGHT</span><span>模拟模式</span></div><div class="flight-status"><span id="status">准备发射</span><strong id="multiplier">1.00<span>×</span></strong><p id="flight-time">飞得越久，收取得分越高</p></div><svg class="flight-path" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="trail" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffb327" stop-opacity="0"/><stop offset="1" stop-color="#ffd17a"/></linearGradient></defs><path id="route" d="M 140 492 Q 370 480 700 360" fill="none" stroke="url(#trail)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div id="rocket" class="rocket"><div class="engine-plume" aria-hidden="true"><i class="plume-shell"></i><i class="plume-core"></i><i class="engine-glow"></i></div><img src="rocket-web3.png" alt="流线型航天器" draggable="false"></div><div id="burst" aria-hidden="true"></div><div class="stage-bottom"><span>FLIGHT TRAJECTORY</span><span>01 / ORBIT</span></div></section><section class="controls"><div class="control-heading"><span>FLIGHT CONTROL</span><h1>选择你的时机。</h1><p>升空，观察，主动收取。</p></div><div class="round-summary"><span>发射消耗 <b>50 <small>积分</small></b></span><span id="payout-label">当前可收取 <b id="payout">—</b></span></div><button id="action" disabled>正在连接大厅…</button><p id="message" role="status" aria-live="polite">每次发射消耗 50 积分；坠毁前主动收取。</p><p class="disclaimer">模拟积分，无真实资金。<br>切出页面不会暂停飞行。</p></section></div><dialog id="dialog"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div id="dialog-actions"></div></dialog></main><script src="dice-audio.js"></script><script src="rocket-audio.js"></script><script src="rocket.js"></script></body></html>
