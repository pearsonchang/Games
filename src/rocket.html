<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>星际航站 · 小火箭</title>
<link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="rocket.css"><link rel="stylesheet" href="arcade-theme.css"><link rel="stylesheet" href="theme-a.css"><link rel="stylesheet" href="rocket-scenery.css"><link rel="stylesheet" href="rocket-port.css"></head>
<body><main class="rocket-game idle thrust-off">
<header><div class="header-left"><button id="back" aria-label="返回游戏大厅">‹</button><div class="brand">ORBIT<span>PLAYROOM</span></div></div><section class="wallet" aria-label="模拟积分余额"><span>模拟积分</span><b id="balance">—</b></section><button id="rocket-sound" aria-pressed="true" aria-label="关闭音效" title="音效开关">♪</button><button id="rules" aria-label="玩法说明">?</button></header>
<div class="port-heading"><div><span>ORBIT PORT</span><h1>星际航站</h1></div><p>小火箭</p></div>
<div class="arena-grid"><div class="space-shell"><section class="space" id="space" aria-label="火箭飞行画面">
<div class="port-panorama" aria-hidden="true"><div class="port-station"></div></div><div id="space-scenery" aria-hidden="true"></div><div id="stars" aria-hidden="true"></div><div id="speed-lines" aria-hidden="true"></div>
<div class="stage-top"><span>DEPARTURE 01</span><span id="flight-label">待命中</span></div><div class="flight-status"><span id="status">准备发射</span><strong id="multiplier">1.00<span>×</span></strong><p id="flight-time">飞得越久，收取得分越高</p></div>
<svg class="flight-path" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="trail" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#9278f3" stop-opacity="0"/><stop offset=".45" stop-color="#a28aff" stop-opacity=".45"/><stop offset="1" stop-color="#49cfff"/></linearGradient></defs><path id="route" d="M 250 462 Q 420 432 650 342" fill="none" stroke="url(#trail)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
<div id="recovery" aria-hidden="true"></div><div id="rocket" class="rocket twin-skiff"><div class="engine-plume engine-far" aria-hidden="true"><i class="plume-shell"></i><i class="plume-core"></i><i class="engine-glow"></i></div><div class="engine-plume engine-near" aria-hidden="true"><i class="plume-shell"></i><i class="plume-core"></i><i class="engine-glow"></i></div><img src="rocket-twin-skiff.webp" width="1536" height="1024" alt="白色驾驶舱与青蓝双引擎的星际飞梭" draggable="false"></div><div id="burst" aria-hidden="true"></div>
<div class="stage-bottom"><span id="port-caption">航站就绪 · 等待点火</span><span>01 / ORBIT</span></div></section>
<div class="port-guide" aria-hidden="true"><img id="port-cat" src="orbit-port-controller-cat.webp" width="1254" height="1254" alt="" draggable="false"><span id="guide-copy">准备好就出发吧</span></div></div>
<section class="controls" aria-label="飞行控制"><div class="round-summary"><span>发射消耗<b>50 <small>积分</small></b></span><span id="payout-label"><span id="payout-caption">当前可收取</span><b id="payout">—</b></span></div><button id="action" disabled>正在连接大厅…</button><p id="message" role="status" aria-live="polite">每次发射消耗 50 积分；坠毁前主动收取。</p><p class="disclaimer">理论返还率 97% · 10× 自动收取<br>模拟积分 · 切出页面不会暂停飞行</p></section></div>
<div id="reward-particles" aria-hidden="true"></div><dialog id="dialog"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div id="dialog-actions"></div></dialog></main>
<script src="game-host.js" data-game="rocket"></script><script src="dice-audio.js"></script><script src="rocket-audio.js"></script><script src="rocket-scenery.js"></script><script src="rocket.js"></script></body></html>
